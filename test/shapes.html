<!doctype html>
<!--
  cursorfit — the shape module under the base state layer.

  The base recipe assumes a circular mark, where scaling is enough. This page puts every
  silhouette through the same four states: a shape that keeps its resting paint on hover is
  the bug this fixture exists to catch.

    node test/extract.mjs
    python -m http.server 8080
    node scripts/verify.mjs http://localhost:8080/test/shapes.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursorfit — shapes under states</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./_generated/cursor.css">
<link rel="stylesheet" href="../assets/shapes.css">
<style>
  :root { --neon-cyan: #00f0ff; --site-bg: #08090b; }
  body {
    margin: 0;
    background: var(--site-bg);
    color: #e8ecf1;
    font: 16px/1.65 ui-sans-serif, system-ui, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 56px 24px 120px; }
  h1 { font-size: 34px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: #98a1ad; max-width: 56ch; }
  .row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 0; border-top: 1px solid #1b1f26;
  }
  .row h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
            color: #5f6b7a; width: 100%; margin: 0; font-weight: 600; }
  a { color: var(--neon-cyan); text-decoration: none; border-bottom: 1px solid #0e5b66; }
  button { font: inherit; color: #e8ecf1; background: #12151a; cursor: pointer;
           border: 1px solid #262c35; border-radius: 999px; padding: 9px 18px; }
  input { font: inherit; color: #e8ecf1; background: #12151a;
          border: 1px solid #262c35; border-radius: 10px; padding: 9px 14px; min-width: 200px; }
  .switcher { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .switcher button[aria-pressed="true"] { border-color: var(--neon-cyan); color: var(--neon-cyan); }
</style>
</head>
<body>
<main>
  <h1>Seven shapes, four states</h1>
  <p>Each silhouette is checked against the same base state layer: link opens a ring, button
     stretches into a capsule, text hides the mark. Switch shapes and hover the rows.</p>

  <div class="switcher" role="group" aria-label="Cursor shape">
    <button type="button" data-shape="circle" aria-pressed="true">circle</button>
    <button type="button" data-shape="ring" aria-pressed="false">ring</button>
    <button type="button" data-shape="square" aria-pressed="false">square</button>
    <button type="button" data-shape="crosshair" aria-pressed="false">crosshair</button>
    <button type="button" data-shape="pill" aria-pressed="false">pill</button>
    <button type="button" data-shape="bracket" aria-pressed="false">bracket</button>
    <button type="button" data-shape="blob" aria-pressed="false">blob</button>
  </div>

  <div class="row">
    <h2>link</h2>
    <a href="#work" id="t-link">A plain link</a>
  </div>

  <div class="row">
    <h2>button</h2>
    <button type="button" id="t-button">Start a project</button>
  </div>

  <div class="row">
    <h2>text</h2>
    <input id="t-input" value="type in here" aria-label="Sample field">
  </div>

  <div class="row">
    <h2>label</h2>
    <a href="#atlas" id="t-label" data-cursor="view">Atlas, a project card</a>
  </div>
</main>

<script type="module">
  import { initCursor } from './_generated/cursor.js';

  initCursor();

  const mark = document.querySelector('.cf-cursor__mark');
  const buttons = [...document.querySelectorAll('.switcher button')];
  for (const b of buttons) {
    b.addEventListener('click', () => {
      for (const o of buttons) o.setAttribute('aria-pressed', String(o === b));
      mark.className = 'cf-cursor__mark cf-shape--' + b.dataset.shape;
    });
  }
</script>
</body>
</html>
