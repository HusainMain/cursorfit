<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Application</h1>
    <p>Ten minutes, one form, no account needed until the end.</p>
    <form>
      <label>First name <input name="first" type="text"></label>
      <label>Last name <input name="last" type="text"></label>
      <label>Email <input name="email" type="email"></label>
      <label>Phone <input name="phone" type="tel"></label>
      <label>Company <input name="company" type="text"></label>
      <label>Role <input name="role" type="text"></label>
      <label>Website <input name="site" type="url"></label>
      <label>City <input name="city" type="text"></label>
      <label>Country <input name="country" type="text"></label>
      <label>Postcode <input name="postcode" type="text"></label>
      <label>Budget <input name="budget" type="number"></label>
      <label>Timeline <input name="timeline" type="text"></label>
      <label>Team size <input name="team" type="number"></label>
      <label>Referral <input name="referral" type="text"></label>
      <label>Project name <input name="project" type="text"></label>
      <label>Repository <input name="repo" type="url"></label>
      <label>Stack <input name="stack" type="text"></label>
      <label>Deadline <input name="deadline" type="date"></label>
      <label>Notes <textarea name="notes" rows="3"></textarea></label>
      <label>Requirements <textarea name="requirements" rows="3"></textarea></label>
      <label>Constraints <textarea name="constraints" rows="2"></textarea></label>
      <label>Success criteria <textarea name="success" rows="2"></textarea></label>
      <label>Anything else <textarea name="extra" rows="2"></textarea></label>
      <div class="actions">
        <button class="btn btn--primary" type="submit">Submit</button>
        <button class="btn" type="button">Save draft</button>
        <button class="btn" type="button" disabled>Clear</button>
      </div>
    </form>
  </main>
</body>
</html>
